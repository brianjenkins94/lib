{
  "name": "deploy",
  # Reusable Pages-deploy workflow (called via `uses:` from a repo's own cd). The COMMON app-deploy shape:
  # checkout → shared setup → a caller-supplied build/publish command → pages-deploy. The caller owns the
  # TRIGGER (push, or workflow_run after ci + the success gate); this owns the steps. `release` names the
  # workspaces util-publish releases (see util/scripts/release.ts).
  "on": {
    "workflow_call": {
      "inputs": {
        "run": { "type": "string", "required": true, "description": "Command(s) to run after setup, before the Pages deploy — the build/publish step (e.g. `npx util-publish`, or `pnpm run build && pnpm run --if-present test`)." },
        "pages-path": { "type": "string", "required": false, "default": "docs", "description": "Directory to deploy to GitHub Pages." },
        "workspace-packages": { "type": "string", "required": false, "default": "", "description": "Forwarded to the setup action: comma-separated globs to install as an ephemeral pnpm workspace (link sibling packages in CI)." },
        "strict-dep-builds": { "type": "string", "required": false, "default": "false", "description": "Forwarded to the setup action." },
        "node-version": { "type": "string", "required": false, "default": "lts/*", "description": "Forwarded to the setup action." },
        "release": { "type": "string", "required": false, "default": "", "description": "Comma-separated globs of the workspaces util-publish releases (e.g. `packages/*,components/*`; `.` is the repo root): each non-private match gets its own GitHub release series, with its tarball attached — and in CI, only these publish. The caller must grant contents: write." }
      },
      "secrets": {
        "NPM_TOKEN": { "required": false }
      }
    }
  },
  # pages + id-token for the Pages deploy (id-token also carries npm provenance); contents:write lets the
  # `release` workspaces' GitHub releases be cut. A caller's token is the INTERSECTION of its own grant and this
  # block, so a repo that sets no `release` (and grants only contents:read) is unaffected.
  "permissions": {
    "contents": "write",
    "pages": "write",
    "id-token": "write"
  },
  "jobs": {
    "deploy": {
      "runs-on": "ubuntu-latest",
      "environment": {
        "name": "github-pages",
        "url": "${{ steps.deploy.outputs.page_url }}"
      },
      "steps": [
        { "uses": "actions/checkout@v4" },
        {
          "uses": "brianjenkins94/lib/.github/actions/setup@main",
          "with": {
            "node-version": "${{ inputs.node-version }}",
            "strict-dep-builds": "${{ inputs.strict-dep-builds }}",
            "workspace-packages": "${{ inputs.workspace-packages }}"
          }
        },
        {
          # GH_TOKEN so util-publish can see (drafts are invisible to unauthenticated gh), cut, and publish the
          # releases of the RELEASE_WORKSPACES. GITHUB_REPOSITORY_OWNER scopes the published `@<owner>/<pkg>` name.
          "run": "${{ inputs.run }}",
          "env": {
            "NPM_TOKEN": "${{ secrets.NPM_TOKEN }}",
            "GH_TOKEN": "${{ github.token }}",
            "GITHUB_REPOSITORY_OWNER": "${{ github.repository_owner }}",
            "RELEASE_WORKSPACES": "${{ inputs.release }}"
          }
        },
        {
          "id": "deploy",
          "uses": "brianjenkins94/lib/.github/actions/pages-deploy@main",
          "with": { "path": "${{ inputs.pages-path }}" }
        }
      ],
      "timeout-minutes": 15
    }
  }
}

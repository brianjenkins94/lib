{
  "name": "deploy",
  # Reusable Pages-deploy workflow (called via `uses:` from a repo's own cd). The COMMON app-deploy shape:
  # checkout → shared setup → a caller-supplied build/publish command → pages-deploy. The caller owns the
  # TRIGGER (push, or workflow_run after ci + the success gate); this owns the steps. `release: true` opts into
  # a SIMPLE per-package util-release; repos needing bespoke release logic (lib, partner-api-docs — per-package
  # matrices, AI notes) keep their own cd instead of calling this.
  "on": {
    "workflow_call": {
      "inputs": {
        "run": { "type": "string", "required": true, "description": "Command(s) to run after setup, before the Pages deploy — the build/publish step (e.g. `npx util-publish`, or `pnpm run build && pnpm run --if-present test`)." },
        "pages-path": { "type": "string", "required": false, "default": "docs", "description": "Directory to deploy to GitHub Pages." },
        "workspace-packages": { "type": "string", "required": false, "default": "", "description": "Forwarded to the setup action: comma-separated globs to install as an ephemeral pnpm workspace (link sibling packages in CI)." },
        "strict-dep-builds": { "type": "string", "required": false, "default": "false", "description": "Forwarded to the setup action." },
        "node-version": { "type": "string", "required": false, "default": "lts/*", "description": "Forwarded to the setup action." },
        "release": { "type": "string", "required": false, "default": "false", "description": "When \"true\", cut/promote a GitHub release per non-private package (util-release) before the run step; the caller must grant contents: write." }
      },
      "secrets": {
        "NPM_TOKEN": { "required": false }
      }
    }
  },
  # pages + id-token for the Pages deploy (id-token also carries npm provenance); contents:write lets the
  # opt-in `release` step cut GitHub releases. A caller's token is the INTERSECTION of its own grant and this
  # block, so a repo that doesn't set `release: true` (and grants only contents:read) is unaffected.
  "permissions": {
    "contents": "write",
    "pages": "write",
    "id-token": "write"
  },
  "jobs": {
    "deploy": {
      "runs-on": "ubuntu-latest",
      "environment": {
        "name": "github-pages",
        "url": "${{ steps.deploy.outputs.page_url }}"
      },
      "steps": [
        { "uses": "actions/checkout@v4" },
        {
          "uses": "brianjenkins94/lib/.github/actions/setup@main",
          "with": {
            "node-version": "${{ inputs.node-version }}",
            "strict-dep-builds": "${{ inputs.strict-dep-builds }}",
            "workspace-packages": "${{ inputs.workspace-packages }}"
          }
        },
        {
          # Opt-in: ensure a GitHub release per publishable workspace BEFORE the build/publish step, so
          # util-publish can attach its freshly-built tarball. util-release keeps a rolling DRAFT tagged
          # `<workspace>@<version>` (the tag util-publish looks up) for each non-private workspace matching
          # `workspace-packages` — versioned off the archived `docs/<ws>@latest.tgz` it primes from Pages. The
          # globs scope to one level, so an app's bundled sub-packages never get a draft (hence never publish).
          # Empty `workspace-packages` → the single-package `v<version>` release at the repo root instead.
          "if": "${{ inputs.release == 'true' }}",
          "name": "Cut GitHub releases (util-release)",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "WS_GLOBS": "${{ inputs.workspace-packages }}",
            "GITHUB_REPOSITORY_OWNER": "${{ github.repository_owner }}"
          },
          "run": "npx util-release"
        },
        {
          # GH_TOKEN so util-publish's `gh release view <ws>@<version>` can SEE the draft releases the step
          # above cut — drafts are invisible to unauthenticated gh, so without it every package is skipped as
          # "no GitHub release exists". GITHUB_REPOSITORY_OWNER scopes the published `@<owner>/<pkg>` name.
          "run": "${{ inputs.run }}",
          "env": {
            "NPM_TOKEN": "${{ secrets.NPM_TOKEN }}",
            "GH_TOKEN": "${{ github.token }}",
            "GITHUB_REPOSITORY_OWNER": "${{ github.repository_owner }}"
          }
        },
        {
          "id": "deploy",
          "uses": "brianjenkins94/lib/.github/actions/pages-deploy@main",
          "with": { "path": "${{ inputs.pages-path }}" }
        }
      ],
      "timeout-minutes": 15
    }
  }
}

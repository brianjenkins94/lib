{
  "name": "ci",
  "on": {
    "pull_request": {
      "branches": ["main"]
    },
    "push": {
      "branches": ["main"]
    },
    "workflow_call": {}
  },
  "concurrency": {
    "group": "${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "build-lint-test": {
      "runs-on": "ubuntu-latest",
      "strategy": {
        "matrix": {
          "script": ["build", "lint", "test"]
        }
      },
      "steps": [
        { "uses": "actions/checkout@v4" },
        { "uses": "./.github/actions/setup" },
        { "run": "pnpm run --if-present ${{ matrix.script }} " }
      ],
      "timeout-minutes": 15
    }
  }
}

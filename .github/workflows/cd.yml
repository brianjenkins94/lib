{
  "name": "cd",
  "on": {
    "workflow_dispatch": null,
    # Fire automatically when CI finishes on main. workflow_run runs on the built-in GITHUB_TOKEN —
    # no PAT/`gh workflow run` dispatch hand-off needed. The entry + deploy jobs gate on CI success.
    "workflow_run": {
      "workflows": ["ci"],
      "types": ["completed"],
      "branches": ["main"]
    }
  },
  "concurrency": {
    "group": "${{ github.workflow }}-${{ github.ref }}"
  },
  # contents:write lets the built-in GITHUB_TOKEN cut + promote releases (no PAT needed); pages + id-token
  # are for the Pages deploy. lib's cd is terminal — no release-triggered workflow depends on the release
  # event cascading, which a GITHUB_TOKEN-created release wouldn't fire anyway.
  "permissions": {
    "contents": "write",
    "pages": "write",
    "id-token": "write"
  },
  "jobs": {
    #"changes": {
    #   "runs-on": "ubuntu-latest",
    #   "steps": [
    #     { "uses": "actions/checkout@v4" },
    #     { "uses": "./.github/actions/detect-changes", "id": "changes" }
    #   ],
    #   "outputs": {
    #     "packages": "${{ steps.changes.outputs.packages }}"
    #   },
    #   "timeout-minutes": 15
    #},
    "list-packages": {
      # Only after a manual dispatch or a successful CI run on main (workflow_run fires on failure too).
      "if": "${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}",
      "runs-on": "ubuntu-latest",
      "steps": [
        { "uses": "actions/checkout@v4" },
        {
          "id": "enumerate",
          "shell": "bash",
          "run": "echo \"packages=$(git ls-files */package.json */*/package.json | while read -r f; do [ \"$(jq -r '.private // false' \"$f\")\" = true ] || dirname \"$f\"; done | jq --raw-input --slurp --compact-output 'split(\"\\n\") | map(select(length > 0))')\" >> \"$GITHUB_OUTPUT\""
        }
      ],
      "outputs": {
        "packages": "${{ steps.enumerate.outputs.packages }}"
      },
      "timeout-minutes": 15
    },
    "release": {
      "if": "needs.list-packages.outputs.packages != '' && needs.list-packages.outputs.packages != '[]'",
      "runs-on": "ubuntu-latest",
      "needs": ["list-packages"],
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "package": "${{ fromJSON(needs.list-packages.outputs.packages) }}"
        }
      },
      "steps": [
        { "uses": "actions/checkout@v4" },
        { "uses": "./.github/actions/setup" },
        {
          "working-directory": "${{ matrix.package }}",
          "run": "pnpm run --if-present build"
        },
        {
          "id": "tag",
          "env": {
            "GH_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
          },
          "run": "echo \"TAG_NAME=$(.github/workflows/scripts/tag.sh \"${{ matrix.package }}\")\" >> \"$GITHUB_OUTPUT\""
        },
        {
          "uses": "softprops/action-gh-release@v2",
          "with": {
            "draft": true,
            "tag_name": "${{ steps.tag.outputs.TAG_NAME }}",
            "token": "${{ secrets.GITHUB_TOKEN }}"
          }
        }
      ],
      "timeout-minutes": 15
    },
    "publish": {
      "runs-on": "ubuntu-latest",
      "needs": ["list-packages", "release"],
      "steps": [
        { "uses": "actions/checkout@v4" },
        { "uses": "./.github/actions/setup" },
        { "run": "jq -r '.[]' <<< '${{ needs.list-packages.outputs.packages }}' | while read -r pkg; do curl --location --fail --show-error --silent --create-dirs --output \"docs/$pkg@latest.tgz\" \"https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/$pkg@latest.tgz\" || rm -f \"docs/$pkg@latest.tgz\"; done" },
        {
          "env": {
            "GH_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
          },
          "run": ".github/workflows/scripts/publish.sh $(jq --raw-output '.[]' <<< '${{ needs.list-packages.outputs.packages }}')"
        },
        {
          # Ship even when a sibling package failed: publish.sh promoted the successes and exited non-zero
          # only at the very end, so the docs/ tarballs that DID build are ready — deploy them regardless.
          "if": "${{ !cancelled() }}",
          "uses": "actions/upload-pages-artifact@v3",
          "with": {
            "path": "./docs"
          }
        }
      ],
      "timeout-minutes": 15
    },
    "deploy": {
      "runs-on": "ubuntu-latest",
      # !cancelled() (not the implicit success()) so a partial-failure publish still deploys the successes;
      # AND gated on CI success so a workflow_run fired by a FAILED ci doesn't deploy (deploy uses
      # !cancelled(), which would otherwise run through the skipped upstream jobs).
      "if": "${{ !cancelled() && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}",
      "environment": {
        "name": "github-pages",
        "url": "${{ steps.deployment.outputs.page_url }}"
      },
      "needs": ["publish"],
      "steps": [
        { "uses": "actions/deploy-pages@v4" }
      ],
      "timeout-minutes": 15
    },
    "smoke-test": {
      "runs-on": "ubuntu-latest",
      "needs": ["list-packages", "deploy"],
      "if": "needs.list-packages.outputs.packages != '' && needs.list-packages.outputs.packages != '[]'",
      "steps": [
        { "uses": "actions/checkout@v4" },
        { "uses": "./.github/actions/setup" },
        { "run": ".github/workflows/scripts/smoke.sh $(jq --raw-output '.[]' <<< '${{ needs.list-packages.outputs.packages }}')" }
      ],
      "timeout-minutes": 15
    }
  }
}

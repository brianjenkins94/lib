{
  "name": "cd",
  "on": {
    "workflow_dispatch": null,
    # Fire automatically when CI finishes on main. workflow_run runs on the built-in GITHUB_TOKEN —
    # no PAT/`gh workflow run` dispatch hand-off needed. The cd job gates on CI success.
    "workflow_run": {
      "workflows": ["ci"],
      "types": ["completed"],
      "branches": ["main"]
    }
  },
  "concurrency": {
    "group": "${{ github.workflow }}-${{ github.ref }}"
  },
  # Must grant at least what the reusable deploy workflow needs (its token is the intersection): contents:write
  # for util-publish to cut + publish releases, pages + id-token for the Pages deploy.
  "permissions": {
    "contents": "write",
    "pages": "write",
    "id-token": "write"
  },
  "jobs": {
    "cd": {
      # Only after a manual dispatch or a successful CI run on main (workflow_run fires on failure too).
      "if": "${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}",
      # The same reusable deploy + release model as every other repo: one draft per released workspace at its
      # last published release + 1, promoted by bumping that workspace's package.json.version; util-publish
      # attaches the tarball and publishes a promote. lib runs its OWN util-publish source (it has no bins), and
      # passes no `workspace-packages`, which would turn the install into a pnpm workspace (lib installs each
      # workspace on its own).
      "uses": "./.github/workflows/deploy.yml",
      "with": {
        "run": "pnpm run publish",
        "release": "util"
      }
    },
    "smoke-test": {
      # Install util from its LIVE Pages tarball and import every export.
      "runs-on": "ubuntu-latest",
      "needs": ["cd"],
      "steps": [
        { "uses": "actions/checkout@v4" },
        { "uses": "./.github/actions/setup" },
        { "run": "npx tsx .github/workflows/scripts/smoke.ts util" }
      ],
      "timeout-minutes": 15
    }
  }
}

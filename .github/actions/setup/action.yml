{
  "name": "setup",
  "description": "Shared Node + pnpm setup: setup-node, pnpm, pnpm-store cache, and a supply-chain-cooldown install. Dependency build-script strictness is applied EPHEMERALLY on the install (--config.strictDepBuilds), so the committed pnpm-workspace.yaml is never mutated. Run AFTER actions/checkout (install needs the working tree).",
  "inputs": {
    "node-version": {
      "description": "Node version for setup-node.",
      "required": false,
      "default": "lts/*"
    },
    "release-age": {
      "description": "pnpm minimumReleaseAge in minutes — the supply-chain quarantine window (default 7 days).",
      "required": false,
      "default": "10080"
    },
    "strict-dep-builds": {
      "description": "pnpm strictDepBuilds, passed ephemerally to `pnpm install`. Default 'false': don't fail the install over un-allowlisted dependency build scripts (the ones that matter — esbuild, isolated-vm — ship prebuilds). Set 'true' to gate them.",
      "required": false,
      "default": "false"
    },
    "install-flags": {
      "description": "Extra flags appended to `pnpm install` (e.g. '--prod' to skip devDependencies).",
      "required": false,
      "default": ""
    }
  },
  "runs": {
    "using": "composite",
    "steps": [
      {
        "uses": "actions/setup-node@v4",
        "with": { "node-version": "${{ inputs.node-version }}" }
      },
      {
        "uses": "pnpm/action-setup@v4",
        "with": { "version": "latest", "run_install": false }
      },
      {
        "uses": "actions/cache@v4",
        "with": {
          "path": "~/.pnpm-store",
          "key": "pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}",
          "restore-keys": "pnpm-store-${{ runner.os }}-"
        }
      },
      {
        "shell": "bash",
        "run": "pnpm install ${{ inputs.install-flags }} --config.minimumReleaseAge=${{ inputs.release-age }} --config.strictDepBuilds=${{ inputs.strict-dep-builds }}"
      }
    ]
  }
}

{
  "name": "setup",
  "description": "Shared Node + pnpm setup: setup-node, pnpm, pnpm-store cache, and a supply-chain-cooldown install. When strict-dep-builds is 'false' (default) it runs `pnpm config set strictDepBuilds false` first — pnpm only honours strictDepBuilds from pnpm-workspace.yaml, not from a --config flag, so this writes it into the CI CHECKOUT's file (ephemeral, never committed back) to keep ignored dependency build scripts a warning rather than a hard ERR_PNPM_IGNORED_BUILDS. Run AFTER actions/checkout (install needs the working tree).",
  "inputs": {
    "node-version": {
      "description": "Node version for setup-node.",
      "required": false,
      "default": "lts/*"
    },
    "release-age": {
      "description": "pnpm minimumReleaseAge in minutes — the supply-chain quarantine window (default 7 days).",
      "required": false,
      "default": "10080"
    },
    "strict-dep-builds": {
      "description": "pnpm strictDepBuilds. Default 'false': `pnpm config set` writes it into the CI checkout's pnpm-workspace.yaml so ignored dependency build scripts stay a warning (the ones that matter — esbuild, isolated-vm — ship prebuilds). Set 'true' to skip that and let pnpm hard-fail on ignored builds.",
      "required": false,
      "default": "false"
    },
    "install-flags": {
      "description": "Extra flags appended to `pnpm install` (e.g. '--prod' to skip devDependencies).",
      "required": false,
      "default": ""
    },
    "workspace-packages": {
      "description": "Comma-separated package globs (e.g. 'packages/*,components/*'). When set, writes an EPHEMERAL pnpm-workspace.yaml (those globs + linkWorkspacePackages: true) into the CI checkout before install — never committed back — so a repo that is NOT a committed pnpm workspace still links its sibling packages (a `\"*\"` dep on a sibling resolves to the local package instead of 404-ing on the registry). Leave empty to install exactly as-is.",
      "required": false,
      "default": ""
    }
  },
  "runs": {
    "using": "composite",
    "steps": [
      {
        "uses": "actions/setup-node@v4",
        "with": { "node-version": "${{ inputs.node-version }}" }
      },
      {
        "uses": "pnpm/action-setup@v4",
        "with": { "version": "latest", "run_install": false }
      },
      {
        "uses": "actions/cache@v4",
        "with": {
          "path": "~/.pnpm-store",
          "key": "pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}",
          "restore-keys": "pnpm-store-${{ runner.os }}-"
        }
      },
      {
        "if": "${{ inputs.workspace-packages != '' }}",
        "shell": "bash",
        "env": { "WS": "${{ inputs.workspace-packages }}" },
        "run": "{ echo packages:; IFS=',' read -ra g <<< \"$WS\"; for p in \"${g[@]}\"; do echo \"  - $p\"; done; echo 'linkWorkspacePackages: true'; } > pnpm-workspace.yaml"
      },
      {
        "if": "${{ inputs.strict-dep-builds == 'false' }}",
        "shell": "bash",
        "run": "pnpm config set --location=project strictDepBuilds false"
      },
      {
        "shell": "bash",
        "run": "pnpm install ${{ inputs.install-flags }} --config.minimumReleaseAge=${{ inputs.release-age }}"
      }
    ]
  }
}
